<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCycle | Premium E-Waste Recovery</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .container {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            padding: 0 20px;
        }

        nav {
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(16px);
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-zone {
            display: block;
            border: 2px dashed var(--text-dim);
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            margin-top: 10px;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.05);
            color: var(--primary);
            transform: scale(1.02);
        }

        .gps-btn, .export-btn, .clear-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .gps-btn:hover { background: rgba(0, 242, 254, 0.2); transform: translateY(-2px); }

        #loc-status {
            padding: 12px;
            background: rgba(0, 242, 254, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.1);
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-bolt"></i> EcoCycle</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span id="user-greeting" style="font-weight: 600; font-size: 0.9rem; color: var(--primary);"></span>
        <button id="logout-btn" onclick="logout()" style="display: none; background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.4); color: white; padding: 6px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s;">Logout</button>
    </div>
</nav>

<div class="container" id="app-container">
    <main id="user-submit-area">
        <div class="box">
            <h3><i class="fas fa-satellite" style="color: var(--primary);"></i> 1. Live Satellite Target</h3>
            <div id="map"></div>
            <div id="loc-status"><i class="fas fa-crosshairs"></i> Awaiting precise location...</div>
            <button class="gps-btn" id="gps-btn" onclick="toggleLiveLocation()"><i class="fas fa-location-arrow"></i> Enable Live Tracking</button>
        </div>

        <div class="box">
            <h3><i class="fas fa-microchip" style="color: var(--accent);"></i> 2. AI Vision Analysis</h3>
            
            <label style="margin-top: 15px;">Upload Image for AI Classification</label>
            <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)" style="display: none;">
            <label for="file-input" class="upload-zone" id="upload-label">
                <i class="fas fa-cloud-upload-alt fa-2x" style="margin-bottom: 10px; display: block;"></i>
                <span id="upload-text">Click to Upload Device Photo</span>
            </label>
            
            <div class="scan-container" id="scan-wrapper">
                <div class="scan-line" id="scan-line"></div>
                <img id="preview" src="">
            </div>

            <div id="ai-process-info" class="ai-box"></div>

            <label style="margin-top: 15px;">Identified Specification</label>
            <input type="text" id="item-name" placeholder="Waiting for AI or manual entry...">
            
            <label>Impact Category</label>
            <select id="item-cat">
                <option value="100">Small Electronics (Phones, Tablets) - 100 pts</option>
                <option value="500">Major Appliances (TVs, Fridges) - 500 pts</option>
                <option value="50">Cables & Accessories - 50 pts</option>
            </select>

            <button class="btn" id="submit-btn" style="margin-top: 30px;" onclick="addEntry()">Submit Recovery Log</button>
        </div>
    </main>

    <aside id="user-sidebar-area">
        <div class="box stat-card">
            <p style="color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Total Impact</p>
            <div class="points" id="total-points">0</div>
            <small style="text-transform: uppercase; letter-spacing: 2px; color: var(--primary); font-weight: 800;">Green Credits</small>
        </div>

        <div class="box">
            <h4 style="margin-top:0; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;">My Active Queries</h4>
            <div id="activity-list"></div>
        </div>
    </aside>
</div>

<div id="bottom-auth-bar" style="text-align: center; margin-top: 20px; padding: 30px; background: rgba(3, 7, 18, 0.8); border-top: 1px solid var(--glass-border); animation: slideUpFade 1s ease forwards;">
    <h3 style="margin-top:0;">Want to report e-waste and track its status?</h3>
    <p style="color: var(--text-dim);">Join the EcoCycle network to upload photos, get AI analysis, and alert municipal authorities.</p>
    <a href="auth.html" class="btn" style="display: inline-block; width: auto; padding: 15px 40px; text-decoration: none;">Login / Register</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="effects.js"></script>
<script>
    // --- STATE & AUTH MANAGEMENT ---
    let data = JSON.parse(localStorage.getItem('ecocycle_v4')) || { items: [], points: 0 };
    let session = JSON.parse(localStorage.getItem('ecocycle_session'));
    let selectedCoords = [19.576, 74.205]; // Default Map
    let capturedImage = "";
    let aiDeterminedProcess = "";
    let displayedPoints = 0;
    let liveWatchId = null;

    function showToast(message, type = "success") {
        const toast = document.createElement('div');
        toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        toast.style.cssText = `
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: ${type === 'error' ? 'rgba(255, 77, 77, 0.95)' : 'rgba(0, 242, 254, 0.95)'};
            color: ${type === 'error' ? '#fff' : '#030712'};
            padding: 14px 28px; border-radius: 50px; font-weight: 700; font-size: 0.95rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; display: flex; align-items: center; gap: 10px;
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.style.transform = 'translateX(-50%) translateY(0)', 10);
        setTimeout(() => {
            toast.style.transform = 'translateX(-50%) translateY(100px)';
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    }

    function logout() {
        localStorage.removeItem('ecocycle_session');
        window.location.reload();
    }

    // --- INITIALIZE VIEWS BASED ON ROLE ---
    if (!session) {
        document.getElementById('file-input').disabled = true;
        document.getElementById('upload-label').onclick = (e) => { e.preventDefault(); window.location.href='auth.html'; };
        document.getElementById('upload-text').innerText = "Login Required to Upload";
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').innerText = "Login to Submit";
        document.getElementById('submit-btn').onclick = () => window.location.href='auth.html';
        initMap();
        updateUI();
    } else {
        document.getElementById('bottom-auth-bar').style.display = 'none';
        document.getElementById('user-greeting').innerHTML = `<i class="fas fa-user-circle"></i> ${session.email} <span style="opacity:0.6; font-size:0.75rem;">(${session.role})</span>`;
        document.getElementById('logout-btn').style.display = 'block';

        if (session.role === 'municipal') {
            renderMunicipalDashboard();
        } else {
            initMap();
            updateUI();
        }
    }

    // --- MUNICIPAL DASHBOARD LOGIC ---
    function renderMunicipalDashboard() {
        document.getElementById('app-container').innerHTML = `
            <div class="box" style="grid-column: 1 / -1;">
                <h3><i class="fas fa-city" style="color: var(--primary);"></i> Municipal Control Center</h3>
                <p style="color: var(--text-dim);">Review AI-classified citizen reports, view screenshots, and update recovery statuses.</p>
                <div id="muni-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px;"></div>
            </div>
        `;
        const grid = document.getElementById('muni-grid');
        
        if(data.items.length === 0) {
            grid.innerHTML = `<p style="opacity: 0.5; padding: 20px;">No citizen queries submitted yet.</p>`;
            return;
        }

        grid.innerHTML = data.items.map((item, index) => {
            let statusClass = item.status === 'Done' ? 'status-done' : (item.status === 'In Progress' ? 'status-progress' : 'status-pending');
            return `
                <div class="history-item" style="display: block; position: relative; animation-delay: ${index * 0.1}s">
                    <span class="status-badge ${statusClass}" style="position: absolute; top: 10px; right: 10px; z-index: 10; backdrop-filter: blur(5px);">
                        ${item.status || 'Pending'}
                    </span>
                    <img src="${item.image}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--glass-border); transition: 0.3s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="font-weight: 800; font-size: 1.1rem; margin-bottom: 5px;">${item.name}</div>
                    <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 10px;">
                        <i class="fas fa-user"></i> ${item.userEmail || 'Anonymous'}<br>
                        <i class="fas fa-map-marker-alt"></i> Lat: ${item.coords[0].toFixed(3)}, Lon: ${item.coords[1].toFixed(3)}
                    </div>
                    <div style="background: rgba(240, 171, 252, 0.1); padding: 10px; border-radius: 8px; font-size: 0.8rem; color: var(--accent); margin-bottom: 15px; border: 1px solid rgba(240, 171, 252, 0.2);">
                        <strong><i class="fas fa-robot"></i> AI Process Plan:</strong><br>${item.aiProcess || 'Standard Manual Processing'}
                    </div>
                    <label>Update Status:</label>
                    <select onchange="updateItemStatus(${item.id}, this.value)" style="padding: 10px; font-size: 0.9rem; margin-top: 5px;">
                        <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="In Progress" ${item.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
                    </select>
                </div>
            `;
        }).join('');
    }

    function updateItemStatus(id, newStatus) {
        const item = data.items.find(i => i.id === id);
        if(item) {
            item.status = newStatus;
            localStorage.setItem('ecocycle_v4', JSON.stringify(data));
            if(newStatus === 'Done' && window.fireConfetti) window.fireConfetti();
            showToast(`Query marked as ${newStatus}`);
            renderMunicipalDashboard();
        }
    }

    // --- MAP & LIVE TRACKING LOGIC ---
    let map, marker;
    function initMap() {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView(selectedCoords, 15);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { pane: 'shadowPane' }).addTo(map);

        marker = L.marker(selectedCoords, {
            draggable: true,
            icon: L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:var(--primary); width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow:0 0 20px var(--primary); animation: pulse 1.5s infinite;'></div>",
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            })
        }).addTo(map);

        map.on('click', function(e) { 
            if(liveWatchId) toggleLiveLocation(); // Stop tracking if user manually clicks map
            updateLocation(e.latlng.lat, e.latlng.lng, true); 
        });
        
        marker.on('dragend', function() { 
            if(liveWatchId) toggleLiveLocation(); 
            const pos = marker.getLatLng(); updateLocation(pos.lat, pos.lng, true); 
        });
        
        if(!document.getElementById('pulse-style')) {
            const style = document.createElement('style');
            style.id = 'pulse-style';
            style.innerHTML = `@keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(0, 242, 254, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); } }`;
            document.head.appendChild(style);
        }
    }

    function updateLocation(lat, lng, fly = false) {
        selectedCoords = [lat, lng];
        marker.setLatLng([lat, lng]);
        
        if(fly) {
            map.flyTo([lat, lng], 17, { duration: 1.2, easeLinearity: 0.25 });
        } else {
            map.panTo([lat, lng]);
        }
        
        const locStatus = document.getElementById('loc-status');
        locStatus.style.background = 'rgba(0, 255, 128, 0.1)';
        locStatus.style.borderColor = 'rgba(0, 255, 128, 0.3)';
        locStatus.style.color = '#00ff80';
        locStatus.innerHTML = `<i class="fas fa-satellite-dish"></i> Satellite Locked: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    // Toggle Continuous GPS Tracking
    function toggleLiveLocation() {
        const btn = document.getElementById('gps-btn');
        
        if (liveWatchId) {
            // Stop Tracking
            navigator.geolocation.clearWatch(liveWatchId);
            liveWatchId = null;
            btn.innerHTML = `<i class="fas fa-location-arrow"></i> Enable Live Tracking`;
            btn.style.background = 'rgba(0, 242, 254, 0.1)';
            showToast("Live tracking suspended.", "error");
        } else {
            // Start Tracking
            if ("geolocation" in navigator) {
                showToast("Acquiring continuous GPS lock...", "success");
                btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Tracking Active...`;
                btn.style.background = 'rgba(0, 255, 128, 0.2)';
                
                let isFirstLock = true;
                liveWatchId = navigator.geolocation.watchPosition(position => {
                    updateLocation(position.coords.latitude, position.coords.longitude, isFirstLock);
                    isFirstLock = false; // Only do the cinematic "flyTo" zoom on the very first lock
                }, error => {
                    showToast("GPS signal lost or denied.", "error");
                    toggleLiveLocation(); // reset button state
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 5000
                });
            } else {
                showToast("Geolocation not supported.", "error");
            }
        }
    }

    // --- AI / ML SIMULATION LOGIC ---
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                capturedImage = reader.result;
                const wrapper = document.getElementById('scan-wrapper');
                const preview = document.getElementById('preview');
                const scanLine = document.getElementById('scan-line');
                
                preview.src = capturedImage;
                document.getElementById('upload-label').style.display = 'none';
                
                wrapper.style.display = 'block';
                scanLine.style.display = 'block';
                scanLine.style.animation = 'scanMotion 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite';
                
                runAIModel();
            }
            reader.readAsDataURL(file);
        }
    }

    function runAIModel() {
        const aiBox = document.getElementById('ai-process-info');
        aiBox.style.display = 'block';
        aiBox.style.opacity = '1';
        aiBox.innerHTML = `<i class="fas fa-crosshairs fa-spin" style="color:var(--primary);"></i> Neural Network scanning scrap architecture...`;
        
        setTimeout(() => {
            document.getElementById('scan-line').style.display = 'none';
            
            const models = [
                { name: "Smartphone / Mobile Board", cat: 100, process: "Phase 1: Lithium-ion battery extracted safely. Phase 2: PCB shredded for chemical precious metal leaching." },
                { name: "Damaged LCD Monitor", cat: 500, process: "Phase 1: Vacuum extraction of cold cathode fluorescent lamps (mercury). Phase 2: Glass sorting." },
                { name: "Mixed Copper Wiring", cat: 50, process: "Phase 1: Mechanical stripping of PVC jacketing. Phase 2: Copper shredding and high-temp smelting." }
            ];
            const result = models[Math.floor(Math.random() * models.length)];
            
            document.getElementById('item-name').value = "AI Detected: " + result.name;
            document.getElementById('item-cat').value = result.cat;
            aiDeterminedProcess = result.process;

            aiBox.innerHTML = `<strong><i class="fas fa-check-double" style="color:#00ff80;"></i> Scrap Classified:</strong> ${result.name}<br><br><strong><i class="fas fa-recycle"></i> Recommended Processing:</strong><br>${result.process}`;
            showToast("AI Classification Complete!");
        }, 3000);
    }

    // --- USER DATA & DYNAMIC DASHBOARD ---
    function animateValue(id, start, end, duration) {
        if (start === end) return;
        const obj = document.getElementById(id);
        obj.classList.add('bounce');
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                obj.classList.remove('bounce');
            }
        };
        window.requestAnimationFrame(step);
    }

    function addEntry() {
        const name = document.getElementById('item-name').value;
        const pts = parseInt(document.getElementById('item-cat').value);

        if (!name || !capturedImage) {
            showToast("Please upload a photo and wait for AI analysis.", "error");
            return;
        }

        const entry = {
            id: Date.now(),
            userEmail: session.email,
            name, 
            points: pts, 
            image: capturedImage, 
            coords: selectedCoords, 
            date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + new Date().toLocaleDateString(),
            status: "Pending",
            aiProcess: aiDeterminedProcess || "Standard Sort"
        };

        data.items.unshift(entry);
        data.points += pts;
        localStorage.setItem('ecocycle_v4', JSON.stringify(data));
        
        if(window.fireConfetti) window.fireConfetti();
        showToast(`Securely transmitted to Municipal Dashboard! +${pts} Credits.`);
        updateUI();
        resetForm();
    }

    function resetForm() {
        document.getElementById('item-name').value = "";
        document.getElementById('file-input').value = "";
        document.getElementById('scan-wrapper').style.display = 'none';
        document.getElementById('upload-label').style.display = 'block';
        document.getElementById('ai-process-info').style.display = 'none';
        capturedImage = "";
        aiDeterminedProcess = "";
    }

    function updateUI() {
        if(!session || session.role === 'municipal') return; 

        const newTotal = data.items
            .filter(i => i.userEmail === session.email)
            .reduce((sum, item) => sum + item.points, 0);
            
        animateValue("total-points", displayedPoints, newTotal, 1500);
        displayedPoints = newTotal;

        const list = document.getElementById('activity-list');
        const userItems = data.items.filter(i => i.userEmail === session.email);

        if (userItems.length === 0) {
            list.innerHTML = `<p style="text-align:center; opacity:0.4; font-size: 0.9rem; padding: 20px;">No active queries. Run your first AI scan!</p>`;
            return;
        }

        list.innerHTML = userItems.slice(0, 5).map((i, index) => {
            let statusClass = i.status === 'Done' ? 'status-done' : (i.status === 'In Progress' ? 'status-progress' : 'status-pending');
            return `
                <div class="history-item" style="animation-delay: ${index * 0.1}s">
                    <div style="display:flex;">
                        <img src="${i.image}" class="thumb" style="width: 60px; height: 60px; object-fit: cover; margin-right: 15px;">
                        <div style="flex:1;">
                            <div style="font-weight:700; font-size: 0.95rem;">${i.name}</div>
                            <div style="font-size:0.75rem; color: var(--text-dim); margin-top: 4px;">
                                <i class="far fa-clock"></i> ${i.date}
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; display:flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.8rem; color: var(--primary); font-weight: 800;">+${i.points} CR</span>
                        <span class="status-badge ${statusClass}">${i.status || 'Pending'}</span>
                    </div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
